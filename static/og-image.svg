<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a3a5c"/>
  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2340" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2463a3" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Cross mark (left accent) -->
  <rect x="80" y="220" width="14" height="190" rx="3" fill="#c8a951" opacity="0.9"/>
  <rect x="40" y="280" width="94" height="14" rx="3" fill="#c8a951" opacity="0.9"/>

  <!-- Gold accent line -->
  <rect x="160" y="315" width="3" height="0" fill="none"/>
  <line x1="160" y1="315" x2="1040" y2="315" stroke="#c8a951" stroke-width="1" opacity="0.2"/>

  <!-- Site name -->
  <text x="160" y="240" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#c8a951" letter-spacing="2">LikeDaniel</text>

  <!-- Tagline -->
  <text x="160" y="300" font-family="Georgia, serif" font-size="26" fill="#e8d5a3" opacity="0.85">Scripture. Thought. Faith.</text>

  <!-- Divider -->
  <rect x="160" y="330" width="80" height="3" rx="1" fill="#c8a951"/>

  <!-- Description -->
  <text x="160" y="390" font-family="Arial, sans-serif" font-size="22" fill="#b8cfe0" opacity="0.9">A blog exploring the Bible one question at a time.</text>

  <!-- Cross watermark (right side) -->
  <rect x="980" y="180" width="20" height="280" rx="4" fill="#c8a951" opacity="0.08"/>
  <rect x="900" y="290" width="180" height="20" rx="4" fill="#c8a951" opacity="0.08"/>
</svg>
